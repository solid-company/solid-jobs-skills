version: 2

# sjctl ships as a self-contained, statically linked binary. modernc.org/sqlite
# is pure Go, so CGO is off and every target cross-compiles cleanly.
project_name: sjctl

before:
  hooks:
    - go mod tidy

builds:
  - id: sjctl
    main: ./cmd/sjctl
    binary: sjctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: sjctl
    # Asset name the bootstrap scripts resolve: sjctl_<os>_<arch>.<ext>
    name_template: "sjctl_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
